[package]
name = "zk_verifier"
version = "0.1.0"
description = "ZK proof verification for Nexum Protocol balance transitions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zk_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
groth16-solana = "0.2.0"
